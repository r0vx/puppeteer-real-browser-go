<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  生产镜像用：让 Chrome 只看到 Windows 字体。
  1. 屏蔽 Linux 发行版自带的西文字体（Liberation、DejaVu）。网站做字体探测时，这些字体出现就说明是 Linux。
  2. 通用字体族与 Windows 版 Chrome 的默认值一致（Chromium locale_settings_win.grd）：
     sans-serif = Arial，serif = Times New Roman，monospace = Courier New；中文分别回落到微软雅黑 / 宋体 / 新宋体。
  文件名用 55：要排在系统的 60-latin.conf 之前，否则那里的偏好（Verdana 等）优先。
  中文字体不屏蔽：没有微软雅黑 / 宋体时，宁可让 Noto CJK 兜底，也不能让中文显示成方块。
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/liberation/*</glob>
      <glob>/usr/share/fonts/truetype/liberation2/*</glob>
      <glob>/usr/share/fonts/truetype/dejavu/*</glob>
    </rejectfont>
  </selectfont>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Arial</family><family>Microsoft YaHei</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Times New Roman</family><family>SimSun</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Courier New</family><family>NSimSun</family></prefer>
  </alias>
</fontconfig>
